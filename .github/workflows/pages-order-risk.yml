name: Publish order-risk demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "demos/order-risk/**"
      - ".github/workflows/pages-order-risk.yml"
  push:
    branches: [main]
    paths:
      - "demos/order-risk/**"
      - ".github/workflows/pages-order-risk.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-order-risk
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test demos/order-risk/tests/smoke.test.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the demo
        run: |
          mkdir -p _site
          cp demos/order-risk/index.html demos/order-risk/styles.css \
            demos/order-risk/app.js demos/order-risk/calc.js \
            demos/order-risk/data.js demos/order-risk/.nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
